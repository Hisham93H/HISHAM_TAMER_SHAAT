# Tests every push, and publishes the website (the public/ folder) to GitHub Pages
# from the default branch. On Pages the site has no server: it searches Haraj straight
# from the visitor's browser and shows sample data where a server is needed.
name: Website

on:
  push:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages-enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check that GitHub Pages is turned on
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --silent; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=GitHub Pages is off::Turn it on in Settings > Pages > Build and deployment > Source: GitHub Actions, then run this workflow again."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: test
    if: needs.test.outputs.pages-enabled == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
